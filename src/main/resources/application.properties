spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# Google Cloud Storage Configuration
# These can be overridden by environment variables: GCS_BUCKET_NAME, GCP_PROJECT_ID, GCS_FILE_PATH
gcs.bucket.name=${GCS_BUCKET_NAME:crm-data-bucket}
gcs.project.id=${GCP_PROJECT_ID:}
# Default file path in GCS for CSV imports
gcs.file.path=${GCS_FILE_PATH:}
# GCS folder for PDF files
gcs.pdf.folder=${GCS_PDF_FOLDER:pdfs}

spring.thymeleaf.cache=false
