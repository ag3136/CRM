spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# Cloud-Ready Timezone Configuration
# Force UTC timezone for consistent behavior across distributed cloud environments
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Azure Blob Storage Configuration (Cloud-Native File Storage)
# Connection string for development/testing (use managed identity in production)
# Set via environment variable: AZURE_STORAGE_CONNECTION_STRING
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Container name for storing application files
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:crm-files}

# Note: In production, use managed identity by setting AZURE_STORAGE_ACCOUNT_NAME environment variable
