spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------
# AWS S3 Configuration (cloud-native storage)
# These values are resolved from environment variables following
# 12-factor app principles. Override via environment variables in AWS:
#   AWS_REGION            - AWS region (e.g. us-east-1)
#   AWS_S3_BUCKET_NAME    - S3 bucket for application storage
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:crm-pdf-storage}
aws.s3.pdf-prefix=pdfs/
