spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------
# Amazon S3 Configuration (cloud-native storage)
# -----------------------------------------------------------------------
# Set these values via environment variables in your cloud deployment.
# Do NOT hard-code bucket names or credentials in this file.
#
# S3_BUCKET_NAME  - the S3 bucket used for PDF uploads and CSV reads
# CSV_OBJECT_KEY  - S3 object key for the CSV file (default: data/input.csv)
# AWS_REGION      - AWS region for the S3 client (default: us-east-1)
#
# Example (environment variables):
#   export S3_BUCKET_NAME=my-crm-bucket
#   export CSV_OBJECT_KEY=data/customers.csv
#   export AWS_REGION=us-east-1
