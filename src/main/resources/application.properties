spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# AWS S3 Configuration for cloud-native file storage
# Replace local file system operations with durable S3 storage
aws.s3.bucket.name=${S3_BUCKET_NAME:crm-data-bucket}
aws.region=${AWS_REGION:us-east-1}

# AWS credentials should be provided via:
# - IAM roles (recommended for EC2, ECS, Lambda)
# - Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# - AWS credentials file (~/.aws/credentials)
# The DefaultCredentialsProvider will automatically detect and use the appropriate method

spring.thymeleaf.cache=false
