spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------
# AWS S3 Configuration (cloud-readiness fix: cr-java-0061, cr-java-0062, cr-java-0063)
# Override these via environment variables in cloud deployments:
#   AWS_REGION            - AWS region where the S3 bucket resides
#   AWS_S3_BUCKET_NAME    - Name of the S3 bucket used for file storage
#   AWS_S3_PDF_PREFIX     - S3 key prefix for generated PDF objects (default: pdfs/)
#   AWS_S3_CSV_OBJECT_KEY - S3 object key for the CSV input file
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.pdf-prefix=${AWS_S3_PDF_PREFIX:pdfs/}
