spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=${CRM_DATASOURCE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${CRM_DATASOURCE_USERNAME:root}
spring.datasource.password=${CRM_DATASOURCE_PASSWORD:password}

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:crm-data}
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=local}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:crm-scheduled-tasks}
azure.servicebus.schedule-delay-seconds=${AZURE_SERVICEBUS_SCHEDULE_DELAY_SECONDS:300}
