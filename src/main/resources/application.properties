spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

# Spring Boot 3.x actuator configuration (replaces deprecated management.security.enabled and management.context-path)
management.endpoints.web.base-path=/appinfo
management.endpoints.web.exposure.include=*

# Thymeleaf configuration (LEGACYHTML5 removed in Spring Boot 3.x, use HTML5 mode)
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Spring Boot 3.x: enable SQL initialization scripts
spring.sql.init.mode=always
